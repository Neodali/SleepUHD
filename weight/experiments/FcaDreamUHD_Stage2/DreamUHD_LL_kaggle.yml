# GENERATE TIME: Mon May 18 14:38:16 2026
# CMD:
# /kaggle/working/FcaDreamuhd/basicsr/train.py -opt /kaggle/working/DreamUHD_LL_kaggle.yml --launcher pytorch

datasets:
  train:
    batch_size_per_gpu: 2
    dataroot_gt: /kaggle/input/datasets/francescoardolino/uhd-ll-dataset/training_set/gt
    dataroot_lq: /kaggle/input/datasets/francescoardolino/uhd-ll-dataset/training_set/input
    dataset_enlarge_ratio: 1
    geometric_augs: true
    gt_size: 512
    io_backend:
      type: disk
    name: General_Image_Train
    num_prefetch_queue: 4
    num_worker_per_gpu: 4
    prefetch_mode: cpu
    type: PairedImageDataset
    use_flip: false
    use_resize_crop: false
    use_rot: false
    use_shuffle: true
  val:
    dataroot_gt: /kaggle/input/datasets/francescoardolino/uhd-ll-dataset/testing_set/gt
    dataroot_lq: /kaggle/input/datasets/francescoardolino/uhd-ll-dataset/testing_set/input
    geometric_augs: false
    gt_size: 512
    io_backend:
      type: disk
    name: General_Image_Valid
    type: PairedImageDataset
    use_flip: false
    use_resize_crop: false
    use_rot: false
dist_params:
  backend: nccl
  port: 16500
find_unused_parameters: true
logger:
  print_freq: 100
  save_checkpoint_freq: 5000.0
  save_latest_freq: 1000.0
  show_tf_imgs_freq: 5000.0
  use_tb_logger: true
manual_seed: 0
model_type: FeMaSRModel
name: FcaDreamUHD_Stage2
network_d:
  num_in_ch: 3
  type: UNetDiscriminatorSN
network_g:
  config: /kaggle/working/FcaDreamuhd/options/VAE_LL.yml
  dim: 16
  dwt_dim: 3
  ffn_scale: 2.0
  n_blocks: 8
  num_heads: 3
  out_dim: 64
  param_key: params_ema
  sample: true
  type: DreamUHD
  upscaling_factor: 8
  vae_weight: /kaggle/input/datasets/francescoardolino/experiments/experiments/VAE_LL/models/net_g_45000.pth
num_gpu: 2
path:
  experiments_root: /kaggle/working/experiments/FcaDreamUHD_Stage2
  log: /kaggle/working/experiments/FcaDreamUHD_Stage2
  models: /kaggle/working/experiments/FcaDreamUHD_Stage2/models
  pretrain_network_d: null
  pretrain_network_g: null
  pretrain_network_hq: null
  resume_state: null
  strict_load: false
  training_states: /kaggle/working/experiments/FcaDreamUHD_Stage2/training_states
  visualization: /kaggle/working/experiments/FcaDreamUHD_Stage2/visualization
scale: 1
train:
  codebook_opt:
    loss_weight: 0
  fft_opt:
    loss_weight: 0.1
    type: FFTLoss
  gan_opt:
    fake_label_val: 0.0
    gan_type: hinge
    loss_weight: 0
    real_label_val: 1.0
    type: GANLoss
  net_d_init_iters: 0.0
  net_d_iters: 0
  optim_g:
    betas:
    - 0.9
    - 0.99
    lr: 0.0008
    type: AdamW
    weight_decay: 0.001
  perceptual_opt:
    loss_weight: 0.0
    type: LPIPSLoss
  pixel_opt:
    loss_weight: 1.0
    reduction: mean
    type: L1Loss
  pixel_ssim_opt:
    loss_weight: 0.25
  scheduler:
    eta_mins:
    - 0.0008
    - 1.0e-07
    periods:
    - 2000
    - 120000
    restart_weights:
    - 1
    - 1
    type: CosineAnnealingRestartCyclicLR
  semantic_opt:
    loss_weight: 0
  total_iter: 61000
  warmup_iter: -1
val:
  key_metric: ssim
  metrics:
    psnr:
      crop_border: 4
      test_y_channel: true
      type: psnr
    ssim:
      crop_border: 4
      test_y_channel: true
      type: ssim
  save_img: false
  val_freq: 3000.0
