# CMD:
# /kaggle/working/FcaDreamuhd/basicsr/train.py -opt /kaggle/working/VAE_LL_kaggle.yml --launcher pytorch

datasets:
  train:
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    geometric_augs: true
    gt_size: 256
    io_backend:
      type: disk
    name: General_Image_Train
    num_prefetch_queue: 4
    num_worker_per_gpu: 4
    prefetch_mode: cpu
    rand_num: 0
    root_file: /kaggle/working/vae_train_paths.txt
    type: SinglecropImageDataset
    use_flip: false
    use_resize_crop: false
    use_rot: false
    use_shuffle: true
  val:
    dataroot_lq: /kaggle/input/datasets/dany27/uhd-ll-dataset/testing_set/gt
    geometric_augs: true
    gt_size: 0
    io_backend:
      type: disk
    name: General_Image_Valid
    type: SingleImageDataset
    use_flip: false
    use_resize_crop: false
    use_rot: false
dist_params:
  backend: nccl
  port: 29500
find_unused_parameters: true
logger:
  print_freq: 100
  save_checkpoint_freq: 5000.0
  save_latest_freq: 1000.0
  show_tf_imgs_freq: 5000.0
  use_tb_logger: true
manual_seed: 0
model_type: VAEModel
name: VAE_LL
network_g:
  ddconfig:
    attn_resolutions:
    - 32
    - 64
    attn_type: restormer
    ch: 16
    ch_mult:
    - 1
    - 2
    - 4
    - 4
    double_z: true
    dropout: 0.0
    freup_type: pad
    in_channels: 3
    num_res_blocks: 2
    out_ch: 3
    res_type: FEblock
    resolution: 256
    z_channels: 4
  embed_dim: 16
  optim:
    lr: 5.0e-05
  type: AutoencoderKL_freup2
num_gpu: 2
path:
  experiments_root: /kaggle/working/experiments/VAE_LL
  log: /kaggle/working/experiments/VAE_LL
  models: /kaggle/working/experiments/VAE_LL/models
  pretrain_network_d: null
  pretrain_network_g: null
  pretrain_network_hq: null
  resume_state: null
  strict_load: false
  training_states: /kaggle/working/experiments/VAE_LL/training_states
  visualization: /kaggle/working/experiments/VAE_LL/visualization
scale: 1
train:
  ema_decay: 0.9
  fft_opt:
    loss_weight: 0.1
    type: FFTLoss
  gan_opt:
    fake_label_val: 0.0
    gan_type: hinge
    loss_weight: 0
    real_label_val: 1.0
    type: GANLoss
  kl_opt:
    loss_weight: 1.0e-06
    type: KlLoss
  net_d_init_iters: 0.0
  net_d_iters: 1
  optim_d:
    betas:
    - 0.9
    - 0.99
    lr: 0.0004
    type: Adam
    weight_decay: 0
  optim_g:
    betas:
    - 0.9
    - 0.99
    lr: 0.0005
    type: AdamW
    weight_decay: 0.001
  perceptual_opt:
    loss_weight: 0.5
    type: LPIPSLoss
  pixel_opt:
    loss_weight: 1.0
    reduction: mean
    type: L1Loss
  scheduler:
    eta_mins:
    - 0.0005
    - 1.0e-07
    periods:
    - 2000
    - 120000
    restart_weights:
    - 1
    - 1
    type: CosineAnnealingRestartCyclicLR
  total_iter: 122000
  warmup_iter: -1
val:
  key_metric: ssim
  metrics:
    psnr:
      crop_border: 4
      test_y_channel: true
      type: psnr
    ssim:
      crop_border: 4
      test_y_channel: true
      type: ssim
  save_img: false
  val_freq: 3000.0
